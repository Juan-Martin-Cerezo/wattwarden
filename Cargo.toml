[workspace]
members = [
    "crates/wattwarden-core",
    "crates/wattwarden-platform",
    "crates/wattwarden-daemon",
    "crates/wattwarden-tui",
    "crates/wattwarden-cli",
]
resolver = "2"

[workspace.package]
version = "2.2.0"
edition = "2021"
authors = ["Juan Martín Cerezo <juanmartincerezo@gmail.com>"]
license = "MIT"
repository = "https://github.com/Juan-Martin-Cerezo/wattwarden"
homepage = "https://github.com/Juan-Martin-Cerezo/wattwarden"
readme = "README.md"
description = "Industrial-grade hardware power governance and telemetry suite for Linux"
keywords = ["power-management", "battery", "energy", "tui", "linux"]
categories = ["command-line-utilities", "hardware-support", "system"]

[workspace.dependencies]
tokio = "1.40"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
nix = { version = "0.29", features = ["user", "signal", "socket", "process"] }

# Small, fast release binaries: one codegen unit, full LTO, no symbols.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
incremental = false

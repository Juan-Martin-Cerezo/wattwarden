name: release

on:
  pull_request:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  native-tests:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run native tests
        run: go test ./...
      - name: Build native binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags='-s -w' .
      - name: Verify local Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tmp_dir=$(mktemp -d)
          trap 'rm -rf "$tmp_dir"' EXIT
          mkdir -p "$tmp_dir/bin"
          DOWNLOAD_URL="file://${GITHUB_WORKSPACE}/wattwarden" INSTALL_DIR="$tmp_dir/bin" bash ./install.sh
          test -x "$tmp_dir/bin/wattwarden"
          file "$tmp_dir/bin/wattwarden" | grep -E 'ELF 64-bit.*x86-64'

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: native-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build release assets
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/wattwarden-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o dist/wattwarden-linux-arm64 .
          GOOS=linux GOARCH=386 go build -trimpath -ldflags='-s -w' -o dist/wattwarden-linux-386 .
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/wattwarden-macos-amd64 .
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o dist/wattwarden-macos-arm64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/wattwarden-windows-amd64.exe .
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

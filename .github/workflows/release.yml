name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build release assets
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/wattwarden-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o dist/wattwarden-linux-arm64 .
          GOOS=linux GOARCH=386 go build -trimpath -ldflags='-s -w' -o dist/wattwarden-linux-386 .
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/wattwarden-macos-amd64 .
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o dist/wattwarden-macos-arm64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/wattwarden-windows-amd64.exe .
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
